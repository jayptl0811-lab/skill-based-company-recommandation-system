<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="620" viewBox="0 0 2480 620" role="img" aria-labelledby="title description">
  <title id="title">SkillMatch Project CPM Network Diagram</title>
  <desc id="description">Critical path schedule for the SkillMatch skill-based job and company recommendation system. The critical path is highlighted in red and has an estimated duration of 21 weeks.</desc>
  <defs>
    <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e9ecef" stroke-width="1"/>
    </pattern>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#smallGrid)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#d8dde1" stroke-width="1.3"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c757d"/>
    </marker>
    <marker id="criticalArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #202124; }
      .node { fill: #fff; stroke: #67727a; stroke-width: 2; }
      .critical-node { fill: #fff8f7; stroke: #c62828; stroke-width: 3; }
      .edge { fill: none; stroke: #6c757d; stroke-width: 2.5; marker-end: url(#arrow); }
      .critical-edge { fill: none; stroke: #c62828; stroke-width: 3.5; marker-end: url(#criticalArrow); }
      .activity { font-size: 20px; font-weight: 600; text-anchor: middle; }
      .duration { font-size: 17px; text-anchor: middle; fill: #42484d; }
      .terminal { font-size: 20px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>
  <rect width="2480" height="620" fill="#fff"/>
  <rect width="2480" height="620" fill="url(#grid)"/>

  <text x="40" y="42" font-size="27" font-weight="700">SkillMatch — Critical Path Method (CPM)</text>
  <text x="2440" y="42" font-size="18" text-anchor="end" fill="#a11f1f">Red = critical path · Estimated duration: 21 weeks</text>

  <!-- Critical path connectors -->
  <path class="critical-edge" d="M130 300 H170"/>
  <path class="critical-edge" d="M310 300 H350"/>
  <path class="critical-edge" d="M510 300 H550"/>
  <path class="critical-edge" d="M710 300 H750"/>
  <path class="critical-edge" d="M930 300 C950 270 950 230 970 230"/>
  <path class="critical-edge" d="M1150 230 C1165 210 1170 180 1190 180"/>
  <path class="critical-edge" d="M1370 180 C1400 210 1415 260 1450 300"/>
  <path class="critical-edge" d="M1610 300 H1650"/>
  <path class="critical-edge" d="M1810 300 H1850"/>
  <path class="critical-edge" d="M2010 300 H2050"/>
  <path class="critical-edge" d="M2210 300 H2250"/>
  <path class="critical-edge" d="M2390 300 H2420"/>

  <!-- Parallel non-critical work streams -->
  <path class="edge" d="M630 270 C665 215 700 160 750 150"/>
  <path class="edge" d="M840 180 V270"/>
  <path class="edge" d="M930 300 C950 335 950 390 970 390"/>
  <path class="edge" d="M1150 230 C1250 250 1370 250 1450 285"/>
  <path class="edge" d="M1150 390 C1260 430 1360 430 1450 320"/>
  <path class="edge" d="M840 180 C1030 80 1290 85 1450 275"/>

  <!-- Start and finish -->
  <rect class="node" x="40" y="276" width="90" height="48"/>
  <text class="terminal" x="85" y="307">Start</text>
  <rect class="node" x="2420" y="276" width="50" height="48"/>
  <text class="terminal" x="2445" y="307">End</text>

  <!-- Main schedule activities -->
  <text class="duration" x="240" y="265">1 week</text>
  <rect class="critical-node" x="170" y="276" width="140" height="48"/>
  <text class="activity" x="240" y="307">Initiation</text>

  <text class="duration" x="430" y="255">2 weeks</text>
  <rect class="critical-node" x="350" y="276" width="160" height="48"/>
  <text class="activity" x="430" y="307">Requirements</text>

  <text class="duration" x="630" y="255">2 weeks</text>
  <rect class="critical-node" x="550" y="276" width="160" height="48"/>
  <text class="activity" x="630" y="307">Design &amp; Planning</text>

  <text class="duration" x="840" y="255">2 weeks</text>
  <rect class="critical-node" x="750" y="276" width="180" height="48"/>
  <text class="activity" x="840" y="307">Database / Data Model</text>

  <text class="duration" x="1060" y="255">4 weeks</text>
  <rect class="critical-node" x="970" y="206" width="180" height="48"/>
  <text class="activity" x="1060" y="237">Backend API</text>

  <text class="duration" x="840" y="112">4 weeks · 4 weeks float</text>
  <rect class="node" x="750" y="126" width="180" height="48"/>
  <text class="activity" x="840" y="157">Frontend Development</text>

  <text class="duration" x="1060" y="365">3 weeks · 3 weeks float</text>
  <rect class="node" x="970" y="366" width="180" height="48"/>
  <text class="activity" x="1060" y="397">Recommendation Engine</text>

  <text class="duration" x="1280" y="137">2 weeks</text>
  <rect class="critical-node" x="1190" y="156" width="180" height="48"/>
  <text class="activity" x="1280" y="187">Authentication &amp; Security</text>

  <text class="duration" x="1530" y="255">2 weeks</text>
  <rect class="critical-node" x="1450" y="276" width="160" height="48"/>
  <text class="activity" x="1530" y="307">Integration</text>

  <text class="duration" x="1730" y="255">3 weeks</text>
  <rect class="critical-node" x="1650" y="276" width="160" height="48"/>
  <text class="activity" x="1730" y="307">Testing &amp; QA</text>

  <text class="duration" x="1930" y="255">1 week</text>
  <rect class="critical-node" x="1850" y="276" width="160" height="48"/>
  <text class="activity" x="1930" y="307">Documentation</text>

  <text class="duration" x="2130" y="255">1 week</text>
  <rect class="critical-node" x="2050" y="276" width="160" height="48"/>
  <text class="activity" x="2130" y="307">Deployment</text>

  <text class="duration" x="2300" y="255">1 week</text>
  <rect class="critical-node" x="2250" y="276" width="140" height="48"/>
  <text class="activity" x="2320" y="307">Closeout</text>

  <rect x="40" y="510" width="18" height="18" rx="3" fill="#fff8f7" stroke="#c62828" stroke-width="3"/>
  <text x="68" y="525" font-size="17">Critical activity</text>
  <rect x="250" y="510" width="18" height="18" rx="3" fill="#fff" stroke="#67727a" stroke-width="2"/>
  <text x="278" y="525" font-size="17">Non-critical activity (available float shown)</text>
  <text x="2440" y="525" text-anchor="end" font-size="17" font-weight="600">Critical path: Start → Initiation → Requirements → Design → Database → Backend → Security → Integration → Testing → Documentation → Deployment → Closeout → End</text>
</svg>
