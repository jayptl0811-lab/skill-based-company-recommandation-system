<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1460" viewBox="0 0 1800 1460" role="img" aria-labelledby="title desc">
  <title id="title">SkillMatch Earned Value Analysis tables</title>
  <desc id="desc">Work Breakdown Structure and Earned Value table, followed by EVA project status summary. All figures are illustrative assumptions.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 36px; font-weight: 700; fill: #17324d; }
      .subtitle { font-size: 19px; fill: #526579; }
      .section { font-size: 24px; font-weight: 700; fill: #17324d; }
      .head { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .cell { font-size: 17px; fill: #243548; }
      .num { font-size: 17px; fill: #243548; text-anchor: end; }
      .total { font-size: 18px; font-weight: 700; fill: #17324d; }
      .note { font-size: 15px; fill: #637386; }
      .status { font-size: 17px; fill: #243548; }
      .statusnum { font-size: 17px; font-weight: 700; fill: #17324d; }
      .rowline { stroke: #dbe3ea; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1800" height="1460" fill="#f4f7fa"/>
  <rect x="50" y="40" width="1700" height="1380" rx="22" fill="#ffffff" stroke="#dce5ed" stroke-width="2"/>

  <text class="title" x="90" y="105">SkillMatch Project — Earned Value Analysis</text>
  <text class="subtitle" x="90" y="145">Illustrative report · Status date: end of week 10 · Planned duration: 21 weeks · Budget at completion (BAC): ₹12,00,000</text>

